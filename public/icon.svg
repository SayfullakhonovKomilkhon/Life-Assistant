<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Calendar Base -->
  <g filter="url(#shadow)" transform="translate(100, 108)">
    <rect width="312" height="280" rx="36" fill="#ffffff" />
    <path d="M 0 36 C 0 16 16 0 36 0 L 276 0 C 296 0 312 16 312 36 L 312 84 L 0 84 Z" fill="#4338ca" />
    
    <!-- Calendar Rings -->
    <rect x="68" y="-14" width="20" height="34" rx="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3" />
    <rect x="224" y="-14" width="20" height="34" rx="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3" />
    
    <!-- Calendar Grid Dots / Events -->
    <circle cx="78" cy="136" r="14" fill="#ec4899" />
    <circle cx="156" cy="136" r="14" fill="#3b82f6" />
    <circle cx="234" cy="136" r="14" fill="#10b981" />
    
    <circle cx="78" cy="196" r="14" fill="#f59e0b" />
    <circle cx="156" cy="196" r="14" fill="#6366f1" />
    <circle cx="234" cy="196" r="14" fill="#06b6d4" />
    
    <!-- Heart / Birthday cake mini mark -->
    <path d="M 78 238 C 78 238 60 220 60 206 C 60 196 68 188 78 198 C 88 188 96 196 96 206 C 96 220 78 238 78 238 Z" fill="#f43f5e" transform="translate(78, 20) scale(0.6)" />
  </g>
  
  <!-- AI Spark Badge -->
  <g filter="url(#shadow)" transform="translate(320, 70)">
    <circle cx="50" cy="50" r="48" fill="url(#sparkGrad)" />
    <!-- 4-point star -->
    <path d="M 50 18 Q 50 50 82 50 Q 50 50 50 82 Q 50 50 18 50 Q 50 50 50 18 Z" fill="#ffffff" />
  </g>
</svg>
